services:
  meeting-app:
    build: .
    container_name: meeting-report-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:8000"
    environment:
      APP_DATA_DIR: "/data"
      EXTERNAL_API_BASE_URL: "${EXTERNAL_API_BASE_URL:-https://api.openai.com/v1}"
      EXTERNAL_API_KEY: "${EXTERNAL_API_KEY:-}"
      EXTERNAL_API_KEY_ENV: "EXTERNAL_API_KEY"
      EXTERNAL_LLM_MODEL: "${EXTERNAL_LLM_MODEL:-gpt-4o-mini}"
      EXTERNAL_TRANSCRIPTION_MODEL: "${EXTERNAL_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}"
      EXTERNAL_TRANSCRIPTION_RESPONSE_FORMAT: "${EXTERNAL_TRANSCRIPTION_RESPONSE_FORMAT:-verbose_json}"
      DEFAULT_LANGUAGE: "zh"
      OUTPUT_LANGUAGE: "繁體中文"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-25}"
      PREVIEW_LIMIT: "${PREVIEW_LIMIT:-12000}"
    volumes:
      - ./data:/data
