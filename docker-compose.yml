services:
  meeting-app:
    build: .
    container_name: meeting-report-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:8000"
    environment:
      APP_DATA_DIR: "/data"
      GOOGLE_API_BASE_URL: "${GOOGLE_API_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-${MEETING_GOOGLE_API_KEY:-${EXTERNAL_API_KEY:-}}}"
      GOOGLE_API_KEY_ENV: "GEMINI_API_KEY"
      GOOGLE_TRANSCRIPTION_MODEL: "${GOOGLE_TRANSCRIPTION_MODEL:-gemini-3.1-flash-lite}"
      GOOGLE_LLM_MODEL: "${GOOGLE_LLM_MODEL:-gemini-3.1-flash-lite}"
      WHISPER_CACHE_DIR: "/models/whisper"
      WHISPER_MODEL: "${WHISPER_MODEL:-base}"
      WHISPER_DEVICE: "${WHISPER_DEVICE:-cpu}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
      DEFAULT_LANGUAGE: "zh"
      OUTPUT_LANGUAGE: "繁體中文"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-800}"
      PREVIEW_LIMIT: "${PREVIEW_LIMIT:-12000}"
    volumes:
      - ./data:/data
      - whisper-cache:/models/whisper

volumes:
  whisper-cache:
