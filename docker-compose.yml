services:
  meeting-app:
    build: .
    container_name: meeting-report-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8001}:8000"
    environment:
      OLLAMA_BASE_URL: "http://ollama:11434"
      APP_DATA_DIR: "/data"
      WHISPER_CACHE_DIR: "/models/whisper"
      WHISPER_MODEL: "${WHISPER_MODEL:-}"
      WHISPER_DEVICE: "${WHISPER_DEVICE:-}"
      WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-}"
      DEFAULT_LANGUAGE: "zh"
      OUTPUT_LANGUAGE: "繁體中文"
      MAX_UPLOAD_MB: "800"
      PREVIEW_LIMIT: "${PREVIEW_LIMIT:-12000}"
    volumes:
      - ./data:/data
      - whisper-cache:/models/whisper
    depends_on:
      - ollama
    gpus: all

  ollama:
    image: ollama/ollama:latest
    container_name: meeting-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_HOST: "0.0.0.0:11434"
    volumes:
      - ollama-data:/root/.ollama
    gpus: all

volumes:
  ollama-data:
  whisper-cache:
